<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full of Cats</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <style>
    :root {
      --bg: #fff8f0;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #7a6a5c;
      --accent: #e8743b;
      --accent-text: #ffffff;
      --shadow: 0 4px 14px rgba(60, 35, 10, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1714;
        --card: #2a221d;
        --text: #f6ece3;
        --muted: #b3a394;
        --accent: #f08a52;
        --accent-text: #1c1714;
        --shadow: 0 4px 14px rgba(0, 0, 0, .45);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }
    header {
      text-align: center;
      padding: 48px 16px 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: -.02em;
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .fact {
      max-width: 640px;
      margin: 0 auto 24px;
      padding: 16px 20px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .fact strong { color: var(--accent); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 0 16px 28px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
      transition: transform .12s ease;
    }
    button:hover { transform: translateY(-2px); }
    button.secondary {
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    button:disabled { opacity: .6; cursor: wait; transform: none; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .cat {
      margin: 0;
      aspect-ratio: 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--card);
      box-shadow: var(--shadow);
      cursor: zoom-in;
    }
    .cat img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }
    .cat:hover img { transform: scale(1.06); }
    .status {
      text-align: center;
      color: var(--muted);
      padding: 24px 0 0;
      min-height: 1.5em;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      padding: 0 16px 40px;
    }
    footer a { color: inherit; }
    dialog {
      border: 0;
      padding: 0;
      background: transparent;
      max-width: 92vw;
      max-height: 92vh;
    }
    dialog::backdrop { background: rgba(0, 0, 0, .8); }
    dialog img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 14px;
      display: block;
      cursor: zoom-out;
    }
  </style>
</head>
<body>
  <header>
    <h1>🐱 Full of Cats</h1>
    <p>An endless supply of cats. That's the whole site.</p>
  </header>

  <div class="fact"><strong>Cat fact:</strong> <span id="fact">Loading a fact…</span></div>

  <div class="controls">
    <button id="more">More cats</button>
    <button id="new-fact" class="secondary">Another fact</button>
    <button id="meow" class="secondary">Meow</button>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <p class="status" id="status"></p>
  </main>

  <footer>
    Photos from <a href="https://thecatapi.com" target="_blank" rel="noopener">TheCatAPI</a> and
    <a href="https://cataas.com" target="_blank" rel="noopener">Cataas</a>.
  </footer>

  <dialog id="viewer"><img alt="A cat, enlarged"></dialog>

  <script>
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const moreBtn = document.getElementById("more");
    const factEl = document.getElementById("fact");
    const viewer = document.getElementById("viewer");
    const BATCH = 12;

    const FACTS = [
      "Cats sleep for around 12 to 16 hours a day.",
      "A group of cats is called a clowder.",
      "Cats have 32 muscles in each ear.",
      "A cat's nose print is unique, much like a human fingerprint.",
      "Cats can rotate their ears 180 degrees.",
      "Most cats have 18 toes: five on each front paw and four on each back paw.",
      "Cats purr at a frequency of roughly 25 to 150 hertz.",
      "A cat can jump up to about six times its own length.",
      "Kittens are born with blue eyes that often change colour later.",
      "Cats use their whiskers to judge whether they can fit through a gap.",
      "Adult cats mostly meow at people, not at other cats.",
      "A cat's sense of smell is far stronger than a human's."
    ];

    function showFact() {
      factEl.textContent = FACTS[Math.floor(Math.random() * FACTS.length)];
    }

    function addCat(url) {
      const figure = document.createElement("figure");
      figure.className = "cat";
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "A cat";
      img.src = url;
      img.onerror = () => figure.remove();
      figure.appendChild(img);
      figure.addEventListener("click", () => {
        viewer.querySelector("img").src = url;
        viewer.showModal();
      });
      grid.appendChild(figure);
    }

    // Cataas serves a random cat per request; the query string keeps each URL distinct.
    function fallbackUrls() {
      return Array.from({ length: BATCH }, () =>
        `https://cataas.com/cat?width=500&height=500&r=${Date.now()}-${Math.random()}`);
    }

    async function loadCats() {
      moreBtn.disabled = true;
      statusEl.textContent = "Fetching cats…";
      let urls;
      try {
        const response = await fetch(`https://api.thecatapi.com/v1/images/search?limit=${BATCH}`);
        if (!response.ok) throw new Error(response.status);
        urls = (await response.json()).map(cat => cat.url);
      } catch (error) {
        urls = fallbackUrls();
      }
      urls.forEach(addCat);
      statusEl.textContent = "";
      moreBtn.disabled = false;
    }

    function meow() {
      const utterance = new SpeechSynthesisUtterance("Meow");
      utterance.pitch = 2;
      utterance.rate = .8;
      speechSynthesis.speak(utterance);
    }

    moreBtn.addEventListener("click", loadCats);
    document.getElementById("new-fact").addEventListener("click", showFact);
    document.getElementById("meow").addEventListener("click", meow);
    viewer.addEventListener("click", () => viewer.close());

    // Load another batch when the reader nears the bottom of the page.
    window.addEventListener("scroll", () => {
      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 300;
      if (nearBottom && !moreBtn.disabled) loadCats();
    });

    showFact();
    loadCats();
  </script>
</body>
</html>
